<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quota Bar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="chip" class="bar" title="Click to refresh · Right-click for stats">
      <div class="info">
        <div class="row">
          <span class="lbl">cache</span>
          <span class="val" id="cache">--</span>
        </div>
        <div class="row">
          <span class="lbl">이득</span>
          <span class="val gain" id="gain">--</span>
        </div>
      </div>
      <div class="spark" id="spark" title="1분 사용량 (API $)"></div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
