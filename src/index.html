<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quota Bar</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="chip" class="bar t-none">
      <!-- peripheral signal: takes the colour of whichever limit bites first -->
      <div class="bar__spine" id="spine"></div>

      <canvas id="bug" class="bar__bug"></canvas>

      <div class="bar__rows" id="rows">
        <div class="mrow" id="rowTop">
          <span class="mrow__lbl">--</span>
          <div class="meter">
            <div class="meter__fill"></div>
            <div class="meter__pace" hidden></div>
          </div>
          <span class="mrow__pct num">--</span>
          <span class="mrow__aux num"></span>
        </div>
        <div class="mrow" id="rowBottom">
          <span class="mrow__lbl">--</span>
          <div class="meter">
            <div class="meter__fill"></div>
            <div class="meter__pace" hidden></div>
          </div>
          <span class="mrow__pct num">--</span>
          <span class="mrow__aux num"></span>
        </div>
      </div>

      <div class="bar__spark" id="sparkWrap">
        <canvas id="spark"></canvas>
        <span class="bar__spark-cap num" id="sparkCap">--</span>
      </div>

      <div class="bar__notice" id="notice" hidden>
        <span class="bar__notice-dot"></span>
        <span id="noticeText">Starting…</span>
      </div>
    </div>

    <script src="common.js"></script>
    <script src="main.js"></script>
  </body>
</html>
