<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quota Bar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="chip" class="bar" title="Click to refresh · Right-click for settings">
      <div class="row five">
        <span class="lbl">5h</span>
        <div class="track"><div class="fill" id="fill5"></div></div>
        <span class="pct" id="pct5">--</span>
        <span class="when" id="when5">--</span>
      </div>
      <div class="row seven">
        <span class="lbl">7d</span>
        <div class="track"><div class="fill" id="fill7"></div></div>
        <span class="pct" id="pct7">--</span>
        <span class="when muted" id="when7"></span>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
