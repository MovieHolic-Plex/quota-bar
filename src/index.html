<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quota Bar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="chip" class="bar" title="Click to refresh · Right-click for stats">
      <canvas id="bug" width="84" height="40"></canvas>
      <div class="info">
        <div class="col">
          <div class="row">
            <span class="lbl">10m</span>
            <span class="val" id="m10">--</span>
          </div>
          <div class="row">
            <span class="lbl">1h</span>
            <span class="val" id="h1">--</span>
          </div>
        </div>
        <div class="col quota">
          <div class="row">
            <span class="lbl">1d</span>
            <span class="val" id="d1">--</span>
          </div>
          <div class="row quota-row">
            <div class="track" title="Pro daily quota">
              <div class="fill" id="qfill"></div>
            </div>
            <span class="pct" id="qpct">--</span>
          </div>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
