<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Quota Bar Settings</title>
    <style>
      html,
      body {
        margin: 0;
        background: #1b1b1b;
        color: #f2f2f2;
        font: 13px/1.4 "Segoe UI Variable", "Segoe UI", sans-serif;
      }
      main {
        padding: 18px 18px 12px;
        display: grid;
        gap: 12px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
        font-weight: 650;
      }
      p {
        margin: 0;
        color: #b5b5b5;
      }
      label {
        display: grid;
        gap: 4px;
        color: #d0d0d0;
      }
      input {
        background: #2a2a2a;
        border: 1px solid #3a3a3a;
        color: #fff;
        border-radius: 6px;
        padding: 8px 10px;
        font: inherit;
      }
      input:focus {
        outline: 1px solid #3dd68c;
      }
      .row {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 8px;
      }
      button {
        border: 0;
        border-radius: 6px;
        padding: 8px 12px;
        font: inherit;
        cursor: pointer;
      }
      .primary {
        background: #3dd68c;
        color: #102018;
        font-weight: 650;
      }
      .ghost {
        background: #2f2f2f;
        color: #eee;
      }
      .ok {
        color: #3dd68c;
        min-height: 1.2em;
      }
      .warn {
        color: #f5c518;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>Quota Bar</h1>
        <p>Key is stored in Windows Credential Manager, not in the git repo.</p>
      </div>
      <label>
        Base URL
        <input id="base" placeholder="https://claude.nekos.me" />
      </label>
      <label>
        API key
        <input id="key" type="password" autocomplete="off" placeholder="sk-clb-…" />
      </label>
      <label>
        Poll interval (seconds)
        <input id="interval" type="number" min="30" step="30" />
      </label>
      <label>
        Probe model
        <input id="model" />
      </label>
      <div class="warn">A 1-token request is sent on each poll. Keep the interval reasonable.</div>
      <div class="ok" id="status"></div>
      <div class="row">
        <button class="ghost" id="cancel">Close</button>
        <button class="primary" id="save">Save</button>
      </div>
    </main>
    <script>
      const { invoke } = window.__TAURI__.core;
      const { getCurrentWindow } = window.__TAURI__.window;

      async function load() {
        const cfg = await invoke("get_settings");
        document.getElementById("base").value = cfg.base_url || "";
        document.getElementById("interval").value = cfg.poll_interval_secs || 180;
        document.getElementById("model").value = cfg.probe_model || "";
        document.getElementById("key").placeholder = cfg.has_key
          ? "saved in Credential Manager (leave blank to keep)"
          : "sk-clb-…";
      }

      document.getElementById("save").onclick = async () => {
        const status = document.getElementById("status");
        status.textContent = "Saving…";
        try {
          await invoke("save_settings", {
            settings: {
              base_url: document.getElementById("base").value.trim(),
              poll_interval_secs: Number(document.getElementById("interval").value),
              probe_model: document.getElementById("model").value.trim(),
              api_key: document.getElementById("key").value,
            },
          });
          document.getElementById("key").value = "";
          status.textContent = "Saved.";
          await invoke("refresh_now");
        } catch (e) {
          status.textContent = String(e);
        }
      };

      document.getElementById("cancel").onclick = async () => {
        await getCurrentWindow().hide();
      };

      load();
    </script>
  </body>
</html>
